workflows:
  ios-openglasses:
    name: Build OpenGlasses Unsigned IPA
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode Project
        script: |
          chmod +x ./Scripts/generate-xcodeproj.sh
          ./Scripts/generate-xcodeproj.sh
      - name: Build App Payload
        script: |
          xcodebuild build \
            -project OpenGlasses.xcodeproj \
            -scheme OpenGlasses \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build
      - name: Package IPA
        script: |
          mkdir -p build/IPA/Payload
          cp -r build/Release-iphoneos/OpenGlasses.app build/IPA/Payload/
          cd build/IPA
          zip -r OpenGlasses.ipa Payload
    artifacts:
      - build/IPA/*.ipa
