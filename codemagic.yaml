workflows:
  ios-workflow:
    name: Build OpenGlasses iOS
    instance_type: mac_mini_m1
    max_build_duration: 30
    scripts:
      - name: Build iOS App
        script: |
          xcodebuild build -scheme OpenGlasses -sdk iphoneos
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
