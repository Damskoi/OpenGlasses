workflows:
  ios-build-unsigned:
    name: Build OpenGlasses IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    scripts:
      - name: Install XcodeGen & Generate Project
        script: |
          brew install xcodegen
          chmod +x ./Scripts/generate-xcodeproj.sh
          ./Scripts/generate-xcodeproj.sh
      - name: Build iOS App (Unsigned)
        script: |
          xcodebuild build \
            -project OpenGlasses.xcodeproj \
            -scheme OpenGlasses \
            -sdk iphoneos \
            -configuration Release \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build
      - name: Package into IPA
        script: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/*.app build/Payload/
          cd build && zip -r OpenGlasses.ipa Payload
    artifacts:
      - build/OpenGlasses.ipa
