workflows:
  ios-openglasses:
    name: Build OpenGlasses Unsigned IPA
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode Project
        script: |
          chmod +x ./Scripts/generate-xcodeproj.sh
          ./Scripts/generate-xcodeproj.sh

      - name: Resolve Swift Packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project OpenGlasses.xcodeproj \
            -scheme OpenGlasses

      - name: Build App Payload
        script: |
          xcodebuild build \
            -project OpenGlasses.xcodeproj \
            -scheme OpenGlasses \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            MTL_ENABLE_DEBUG_INFO=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        script: |
          mkdir -p build/IPA/Payload
          
          # Extraction du binaire de l'application principale
          APP_PATH=$(find build/DerivedData -type d -name "OpenGlasses.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Erreur : OpenGlasses.app introuvable dans DerivedData"
            exit 1
          fi
          
          cp -R "$APP_PATH" build/IPA/Payload/
          cd build/IPA
          zip -r OpenGlasses.ipa Payload

    artifacts:
      - build/IPA/*.ipa
