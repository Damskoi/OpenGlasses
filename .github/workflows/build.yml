name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: List schemes
        run: xcodebuild -list

      - name: Build Archive
        run: |
          xcodebuild archive \
            -scheme OpenGlasses-Package \
            -destination "generic/platform=iOS" \
            -archivePath build/OpenGlasses.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/OpenGlasses.xcarchive/Products/Applications/*.app Payload/ 2>/dev/null || cp -r build/OpenGlasses.xcarchive/Products/Library/Frameworks/*.app Payload/ 2>/dev/null || cp -r build/OpenGlasses.xcarchive/Products/usr/local/lib/*.app Payload/ 2>/dev/null
          zip -r OpenGlasses.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGlasses-IPA
          path: OpenGlasses.ipa
