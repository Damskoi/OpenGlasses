name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode Project from Package
        run: |
          swift package generate-xcodeproj || true

      - name: Resolve Dependencies with xcodebuild
        run: |
          xcodebuild -resolvePackageDependencies

      - name: Build Archive
        run: |
          xcodebuild archive \
            -scheme OpenGlasses \
            -destination "generic/platform=iOS" \
            -archivePath build/OpenGlasses.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            || \
          xcodebuild archive \
            -scheme OpenGlasses-Package \
            -destination "generic/platform=iOS" \
            -archivePath build/OpenGlasses.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/OpenGlasses.xcarchive/Products/Applications/*.app Payload/ 2>/dev/null || cp -r build/OpenGlasses.xcarchive/Products/Library/Frameworks/*.app Payload/ 2>/dev/null || cp -r build/OpenGlasses.xcarchive/Products/usr/local/lib/*.app Payload/ 2>/dev/null
          zip -r OpenGlasses.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGlasses-IPA
          path: OpenGlasses.ipa
